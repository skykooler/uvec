[package]
name = "uvec"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
# Opt-in Serialize/Deserialize for the whole scene (for host persistence, e.g.
# Lightningbeam's .beam files). uvec stays dependency-free without it.
serde = ["dep:serde"]

[dev-dependencies]
rand = "0.8"
serde_json = "1"

[profile.test]
opt-level = 2
